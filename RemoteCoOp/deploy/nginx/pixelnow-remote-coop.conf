# Managed by PixelNOW Remote Co-Op deployment.
server {
    listen 38473 ssl;
    listen [::]:38473 ssl;
    server_name jayian.dev;

    ssl_certificate /etc/letsencrypt/live/jayian.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jayian.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/pixelnow-remote-coop;
    index index.html;
    server_tokens off;
    client_max_body_size 64k;

    location = /health {
        proxy_pass http://127.0.0.1:32190/health;
        proxy_set_header Host $host;
        access_log off;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:32190;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /remote-coop-direct {
        proxy_pass http://127.0.0.1:32190;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-store" always;
    }
}
